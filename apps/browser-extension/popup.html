<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ogleans</title>
  </head>
  <body>
    <main class="popup">
      <header class="brand-row">
        <div>
          <h1>Ogleans</h1>
          <p class="subtitle">Reading layer</p>
        </div>
        <span id="translation-mode" class="chip">Built-in</span>
      </header>
      <div class="quick-actions">
        <button id="collections" class="primary">Open collection</button>
        <button id="settings">Settings</button>
      </div>
      <div class="translation-actions">
        <button id="translate">Translate</button>
        <button id="stop">Stop</button>
        <button id="restore">Restore</button>
      </div>
      <label for="mode">Display</label>
      <select id="mode">
        <option value="original">Original</option>
        <option value="translation">Translation only</option>
        <option value="bilingual" selected>Bilingual</option>
      </select>
      <div id="actions"></div>
      <p id="status" role="status" aria-live="polite">Ready</p>
      <p class="hint">
        Gestures work without the built-in translator. Try
        <kbd>Alt+Shift+C</kbd> for collections and <kbd>Alt+Shift+S</kbd> to
        save a selection.
      </p>
    </main>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
