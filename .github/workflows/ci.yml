name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install -g pnpm@12.4.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm format:check
      - run: pnpm check
      - uses: actions/upload-artifact@v7
        with:
          name: ogleans-visual-evidence
          path: |
            docs/assets/extension-settings-v0.2.0-alpha.1.png
            docs/assets/collection-disabled.png
            docs/assets/collection-external.png
          if-no-files-found: error
      - run: pnpm audit --prod --audit-level high
      - run: pnpm package
      - uses: actions/upload-artifact@v7
        with:
          name: ogleans-v0.2.0-alpha.1
          path: release/
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: diagnostics
          path: |
            test-results/
            playwright-report/
